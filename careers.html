<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>فرصت‌های شغلی | در بیرجند کجا؟</title>
  <meta name="description" content="به تیم در بیرجند کجا بپیوندید.">
  <meta name="theme-color" content="#2C7F65">
  <link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="careers">
  <div id="layout-top"></div>
  <main id="main">
    <section class="page-head"><div class="container">
      <nav class="crumbs" aria-label="مسیر صفحه"><a href="index.html">خانه</a><span data-ico="chevron"></span><span aria-current="page">فرصت‌های شغلی</span></nav>
      <div class="page-head__row"><div><h1>با ما کار کنید</h1><p>دنبال همکارانی هستیم که بیرجند را دوست دارند و به کیفیت اهمیت می‌دهند.</p></div></div>
    </div></section>
    <section class="section" style="padding-top:32px"><div class="container two-col">
      <div><h2 class="sec-title" style="margin-bottom:16px">موقعیت‌های باز</h2><div class="faq" id="jobs" style="margin:0;max-width:none"></div></div>
      <div class="form-card" id="applyCard"><h2 id="apply">ارسال درخواست</h2><p>همه درخواست‌ها را می‌خوانیم.</p>
        <form id="applyForm" class="form-grid" novalidate>
          <div class="f full"><label for="aJob">موقعیت</label><select class="select" id="aJob"></select></div>
          <div class="f"><label for="aName">نام و نام خانوادگی</label><input class="input" id="aName" required data-req="نام خود را بنویسید." autocomplete="name"></div>
          <div class="f"><label for="aMobile">موبایل</label><input class="input" id="aMobile" required data-pattern="mobile" inputmode="tel" dir="ltr" placeholder="09xxxxxxxxx"></div>
          <div class="f full"><label for="aMsg">چرا این موقعیت؟</label><textarea class="textarea" id="aMsg" required minlength="20" data-req="چند جمله درباره خودتان بنویسید."></textarea></div>
          <div class="full"><button class="btn btn--primary btn--block">ارسال درخواست</button></div>
        </form></div>
    </div></section>
  </main>
  <div id="layout-bottom"></div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
