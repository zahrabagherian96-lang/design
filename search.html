<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>کاوش مکان‌ها | در بیرجند کجا؟</title>
  <meta name="description" content="جستجو در کسب‌وکارهای بیرجند با فیلتر دسته، محله، امتیاز و قیمت، همراه با نقشه.">
  <meta name="theme-color" content="#2C7F65">
  <link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="search">
  <div id="layout-top"></div>
  <main id="main">
    <section class="page-head"><div class="container"><div id="lCrumbs"></div><div class="page-head__row"><div><h1 id="lTitle">همه مکان‌های بیرجند</h1><p id="lLead"></p></div></div><div class="active-chips" id="subs" style="margin:14px 0 0"></div></div></section>
    <div class="filterbar"><div class="container" role="group" aria-label="فیلترها">
      <label class="sr-only" for="fCat">دسته</label><select class="select" id="fCat"></select>
      <label class="sr-only" for="fHood">محله</label><select class="select" id="fHood"></select>
      <label class="sr-only" for="fRating">امتیاز</label><select class="select" id="fRating"><option value="0">هر امتیازی</option><option value="4.5">۴.۵ به بالا</option><option value="4">۴ به بالا</option><option value="3.5">۳.۵ به بالا</option></select>
      <label class="sr-only" for="fPrice">قیمت</label><select class="select" id="fPrice"><option value="0">هر قیمتی</option><option value="1">اقتصادی</option><option value="2">تا متوسط</option><option value="3">تا بالا</option></select>
      <span class="sep"></span>
      <button class="chip" id="fOpen" aria-pressed="false"><span data-ico="clock"></span>الان باز است</button>
      <button class="chip" id="fVerified" aria-pressed="false"><span data-ico="badge"></span>تأییدشده</button>
    </div></div>
    <div class="container listing">
      <section aria-labelledby="count">
        <div class="listing__head"><label class="q-inline"><span data-ico="search"></span><span class="sr-only">جستجو در نتایج</span><input type="search" id="sq" placeholder="جستجو در نام، خدمات یا ویژگی…"></label><h2 id="count" aria-live="polite"></h2><label class="sr-only" for="sort">مرتب‌سازی</label><select class="select" id="sort"><option value="rec">مرتبط‌ترین</option><option value="rating">بالاترین امتیاز</option><option value="reviews">بیشترین نظر</option><option value="cheap">اقتصادی‌ترین</option></select></div>
        <div class="active-chips" id="chips"></div>
        <div class="lrows" id="rows"></div>
        <div class="empty-state" id="noRes" hidden><span data-ico="search"></span><h3>مکانی با این فیلترها پیدا نشد</h3><p>چند فیلتر را بردارید یا عبارت کوتاه‌تری بنویسید.</p><button class="btn btn--primary" id="noResClear">پاک کردن فیلترها</button></div>
        <div class="pager" id="pager"></div>
      </section>
      <aside class="listing__map" aria-label="نقشه نتایج"><div id="listMap"></div></aside>
    </div>
  </main>
  <div id="layout-bottom"></div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
